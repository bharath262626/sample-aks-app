apiVersion : apps/v1
kind: Deployment
metadata:
  name: bharathsampleaksapp 
spec:
  replicas: 1
  selector:
    matchLabels:
      app: bharathsampleaksapp
  template:
    metadata:
      labels:
        app: bharathsampleaksapp 
    spec:
      containers:
        - name: bharathsampleaksapp 
          image: containerregistryapp.azurecr.io/bharathsampleaksapp
          ports:
          - containerPort: 8080