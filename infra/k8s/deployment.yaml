apiVersion: apps/v1
kind: Deployment
metadata:
  name: sample-aks-app
  namespace: sampleapp
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sample-aks-app
  template:
    metadata:
      labels:
        app: sample-aks-app
    spec:
      containers:
      - name: sample-aks-app
        image: sampleplaceholder.azurecr.io/sample-aks-app:latest
        ports:
        - containerPort: 8080
        env:
        - name: APP_NAME
          value: "sample-aks-app"
        - name: APP_VERSION
          value: "1.0.0"
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 15